<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f151c" />
    <title>赛车拆解与涂鸦工作台</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/three.module.js",
          "three/addons/": "./vendor/three/addons/"
        }
      }
    </script>
  </head>
  <body>
    <header class="topbar">
      <div class="identity">
        <h1>赛车工作台</h1>
        <span id="modelName">huh.step</span>
      </div>
      <div class="header-actions">
        <button id="loadModelBtn" type="button">导入模型</button
        ><button id="fitBtn" type="button" data-ready disabled>适应视图</button>
      </div>
    </header>
    <main id="workspace">
      <section id="viewer" aria-label="赛车三维视图">
        <div id="viewLabel">整车视图<span>拖动旋转 · 滚轮缩放</span></div>
        <div id="loading" role="status">
          <span class="spinner"></span
          ><span id="loadingText">正在加载车型…</span>
        </div>
        <div id="error" class="error-panel" role="alert" hidden>
          <h2>暂时无法加载模型</h2>
          <p id="errorText"></p>
          <button id="retryBtn" type="button">重新加载</button>
        </div>
        <div id="brushCursor" aria-hidden="true">
          <span id="pressureReadout">压力 65%</span>
        </div>
        <div id="paintTarget" aria-live="polite">未选择零件</div>
        <div id="hint">左键旋转 · 右键平移 · 滚轮缩放</div>
      </section>
      <aside id="panel" aria-label="模型工具">
        <details id="partsPanel" open>
          <summary>
            <span>部件拆解</span><span id="assemblyState">已装配</span>
          </summary>
          <div class="panel-content">
            <p class="intro">选择部件，查看它与车身的连接。</p>
            <div id="partControls" class="part-list"></div>
            <p id="noParts" class="note" hidden>
              此模型没有可识别的部件名称，可旋转查看与涂鸦。
            </p>
            <div class="button-row">
              <button id="explodeAll" class="primary" data-ready disabled>
                全部拆开</button
              ><button id="assembleAll" data-ready disabled>全部复位</button>
            </div>
            <label class="slider-label" for="explodeDistance"
              ><span>拆解距离</span
              ><output id="distanceValue" for="explodeDistance"
                >100%</output
              ></label
            >
            <input
              id="explodeDistance"
              type="range"
              min="0"
              max="150"
              value="100"
              step="1"
              data-ready
              disabled
            />
            <p class="note">前翼包含源模型中的连体侧板与支架。</p>
          </div>
        </details>
        <section class="paint-panel" aria-labelledby="paintHeading">
          <h2 id="paintHeading">表面涂鸦</h2>
          <div class="mode-switch" role="group" aria-label="操作模式">
            <button
              id="modeAuto"
              class="active"
              aria-pressed="true"
              data-ready
              disabled
            >
              自动</button
            ><button id="modeOrbit" aria-pressed="false" data-ready disabled>
              旋转查看</button
            ><button id="modePaint" aria-pressed="false" data-ready disabled>
              画笔
            </button>
          </div>
          <div class="color-control">
            <div class="control-heading">
              <span>颜色</span>
              <input
                id="colorHex"
                type="text"
                value="#F7C948"
                maxlength="7"
                inputmode="text"
                autocomplete="off"
                spellcheck="false"
                aria-label="十六进制颜色"
                data-ready
                disabled
              />
            </div>
            <div class="color-swatches" role="listbox" aria-label="快速选色">
              <button class="color-swatch active" type="button" data-color="#F7C948" aria-label="黄色" aria-selected="true" data-ready disabled></button>
              <button class="color-swatch" type="button" data-color="#F26A4F" aria-label="珊瑚红" aria-selected="false" data-ready disabled></button>
              <button class="color-swatch" type="button" data-color="#E85D75" aria-label="玫红" aria-selected="false" data-ready disabled></button>
              <button class="color-swatch" type="button" data-color="#A9D18E" aria-label="鼠尾草绿" aria-selected="false" data-ready disabled></button>
              <button class="color-swatch" type="button" data-color="#57B6C9" aria-label="青色" aria-selected="false" data-ready disabled></button>
              <button class="color-swatch" type="button" data-color="#5271FF" aria-label="蓝色" aria-selected="false" data-ready disabled></button>
              <button class="color-swatch" type="button" data-color="#9B6CFF" aria-label="紫色" aria-selected="false" data-ready disabled></button>
              <button class="color-swatch" type="button" data-color="#F1F3F5" aria-label="白色" aria-selected="false" data-ready disabled></button>
              <button class="color-swatch" type="button" data-color="#202A33" aria-label="深灰色" aria-selected="false" data-ready disabled></button>
            </div>
            <div class="custom-color">
              <label for="brushColor">自定义</label
              ><input
                id="brushColor"
                type="color"
                value="#F7C948"
                aria-label="自定义画笔颜色"
                data-ready
                disabled
              />
            </div>
          </div>
          <div class="brush-controls">
            <label for="brushSize">大小</label
            ><input
              id="brushSize"
              type="range"
              min="1"
              max="100"
              value="22"
              data-ready
              disabled
            /><output id="brushSizeValue" for="brushSize">22</output>
          </div>
          <div class="brush-controls brush-secondary">
            <label for="brushOpacity">不透明度</label
            ><input
              id="brushOpacity"
              type="range"
              min="5"
              max="100"
              value="100"
              data-ready
              disabled
            /><output id="brushOpacityValue" for="brushOpacity">100%</output
            ><label class="check-control"
              ><input
                id="pressureToggle"
                type="checkbox"
                checked
                data-ready
                disabled
              />
              压力</label
            >
          </div>
          <div class="tool-switch" role="group" aria-label="画笔工具">
            <button
              id="toolBrush"
              class="active"
              type="button"
              data-ready
              disabled
            >
              画笔
            </button>
            <button id="toolEraser" type="button" data-ready disabled>
              橡皮
            </button>
            <button id="hardBrush" class="active" type="button" data-ready disabled>
              柔边
            </button>
          </div>
          <div class="button-row">
            <button id="undoBtn" disabled>撤销上一笔</button
            ><button id="redoBtn" disabled>重做</button>
          </div>
          <div class="button-row">
            <button id="resetBtn" data-ready disabled>清空涂鸦</button>
          </div>
          <div class="button-row file-actions">
            <button id="saveBtn" data-ready disabled>导出涂鸦</button
            ><button id="openBtn" data-ready disabled>导入涂鸦</button>
          </div>
          <p class="note">
            自动模式：Apple Pencil
            画笔，手指旋转缩放。涂鸦跟随部件移动，并在本机自动保存。
          </p>
        </section>
      </aside>
    </main>
    <footer>
      <span id="status" role="status" aria-live="polite">正在准备模型</span
      ><span id="modelInfo">STEP 装配模型</span>
    </footer>
    <input type="file" id="modelFile" accept=".step,.stp" hidden />
    <input
      type="file"
      id="drawingFile"
      accept=".json,application/json"
      hidden
    />
    <noscript>请启用 JavaScript 后使用赛车工作台。</noscript>
    <script type="module">
      import("./app.js").catch((error) => {
        document.getElementById("loading").hidden = true;
        document.getElementById("error").hidden = false;
        document.getElementById("errorText").textContent =
          "启动失败：" +
          error.message +
          "。请通过 HTTP 静态服务器访问，并使用支持 WebGL 的浏览器。";
        document.getElementById("retryBtn").onclick = () => location.reload();
      });
    </script>
  </body>
</html>
